# Builds ArXivLibrary for macOS (Apple Silicon), Windows (x64) and Linux (x64).
# Tauri apps must be compiled on each target OS, so each platform gets its own
# GitHub-hosted runner. Runs when a version tag (v*) is pushed, or manually.
# The installers are uploaded as workflow artifacts.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            name: macos
            bundles: dmg
          - os: windows-latest
            name: windows
            bundles: msi,nsis
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source-code
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source-code/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        working-directory: source-code/src-tauri
        run: cargo test

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: arxivlibrary-${{ matrix.name }}
          if-no-files-found: error
          path: |
            source-code/src-tauri/target/release/bundle/dmg/*.dmg
            source-code/src-tauri/target/release/bundle/msi/*.msi
            source-code/src-tauri/target/release/bundle/nsis/*.exe
            source-code/src-tauri/target/release/bundle/deb/*.deb
            source-code/src-tauri/target/release/bundle/appimage/*.AppImage
            source-code/src-tauri/target/release/bundle/rpm/*.rpm
